# ============================================================
#  Sveltia CMS – Konfiguration für Bäcker Chris
#  Bearbeitet werden JSON-Dateien im Ordner /content/.
#  Nach dem Speichern baut GitHub Actions die Seite neu (ca. 1–2 Minuten).
# ============================================================

backend:
  name: github
  repo: Hannes0777/baeckerei-chris
  branch: master
  # Eigener Login-Worker nur für diese Website (E-Mail/Passwort, kein GitHub-Konto nötig)
  base_url: https://cms-auth-baeckerei-chris.ehmann-hannes07.workers.dev

# Bilder landen in assets/images/uploads
media_folder: assets/images/uploads
public_folder: assets/images/uploads

media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600

locale: de

collections:

  # ----------------------------------------------------------
  - name: start
    label: "🏠 Startseite"
    files:
      - name: start
        label: "Startseite bearbeiten"
        file: content/start.json
        fields:
          - { name: titel_oben, label: "Große Überschrift: erste Zeile", widget: string }
          - { name: titel_betont, label: "Große Überschrift: zweite Zeile (hervorgehoben)", widget: string }
          - { name: text, label: "Text unter der Überschrift", widget: text }
          - name: woche
            label: "Kasten „Neu diese Woche“"
            widget: object
            hint: "Ideal für Sonderbrote, Saisongebäck oder Aktionen der Woche."
            fields:
              - { name: anzeigen, label: "Kasten auf der Startseite zeigen", widget: boolean, default: true }
              - { name: etikett, label: "Kleines Etikett", widget: string, hint: "z.B. Neu diese Woche, Nur am Wochenende" }
              - { name: titel, label: "Überschrift", widget: string }
              - { name: text, label: "Text", widget: text }
              - { name: bild, label: "Hintergrundbild", widget: image, required: false }

  # ----------------------------------------------------------
  - name: angebot
    label: "🏷️ Angebote"
    description: "Angebote erscheinen oben auf der Startseite, solange das heutige Datum zwischen „Gültig von“ und „Gültig bis“ liegt. Danach verschwinden sie von selbst, es muss nichts gelöscht werden."
    files:
      - name: angebot
        label: "Angebote verwalten"
        file: content/angebot.json
        fields:
          - name: angebote
            label: "Angebote"
            label_singular: "Angebot"
            widget: list
            required: false
            min: 0
            summary: "{{titel}} ({{gueltig_von}} – {{gueltig_bis}})"
            fields:
              - { name: titel, label: "Titel", widget: string, hint: "z.B. Dinkelbrot zum Probierpreis" }
              - { name: text, label: "Kurzer Text (optional)", widget: string, required: false, hint: "z.B. Nur solange der Vorrat reicht" }
              - { name: preis, label: "Preis oder Aktion (optional)", widget: string, required: false, hint: "z.B. 3,90 € oder 2 für 1" }
              - { name: gueltig_von, label: "Gültig von", widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
              - { name: gueltig_bis, label: "Gültig bis", widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false, hint: "Am Tag danach verschwindet das Angebot automatisch." }

  # ----------------------------------------------------------
  - name: ueber_uns
    label: "📖 Über uns"
    files:
      - name: ueber_uns
        label: "Seite „Über uns“"
        file: content/ueber-uns.json
        fields:
          - { name: titel, label: "Überschrift der Seite", widget: string }
          - { name: foto, label: "Foto (z.B. Familie Schiefer)", widget: image, required: false, hint: "Solange kein Foto gewählt ist, steht dort der Platzhalter „Foto folgt“." }
          - { name: foto_alt, label: "Foto beschreiben (für Sehbehinderte und Google)", widget: string, required: false }
          - name: zeitleiste
            label: "Geschichte (Zeitleiste)"
            label_singular: "Abschnitt"
            widget: list
            summary: "{{jahr}}: {{titel}}"
            hint: "Von oben nach unten, ältestes zuerst. Reihenfolge per Ziehen änderbar."
            fields:
              - { name: jahr, label: "Jahr oder Datum", widget: string, hint: "z.B. 2024 oder 9. Mai 2026" }
              - { name: titel, label: "Überschrift", widget: string }
              - { name: text, label: "Text", widget: text }

  # ----------------------------------------------------------
  - name: kontakt
    label: "📞 Kontakt & Adressen"
    files:
      - name: kontakt
        label: "Adressen, Telefon, Social Media"
        file: content/kontakt.json
        fields:
          - { name: seitentitel, label: "Kontaktseite: Überschrift", widget: string }
          - { name: seitentext, label: "Kontaktseite: Text darunter", widget: text }
          - name: baeckerei
            label: "Bäckerei"
            widget: object
            fields:
              - { name: strasse, label: "Straße und Hausnummer", widget: string }
              - { name: plz_ort, label: "PLZ und Ort", widget: string }
              - { name: telefon, label: "Telefon", widget: string, hint: "z.B. 07183 9339144" }
          - name: cafe
            label: "Café am Pflegecampus"
            widget: object
            fields:
              - { name: strasse, label: "Straße (und Hausnummer)", widget: string }
              - { name: plz_ort, label: "PLZ und Ort", widget: string }
          - { name: instagram, label: "Instagram-Link", widget: string }
          - { name: facebook, label: "Facebook-Link", widget: string }

  # ----------------------------------------------------------
  - name: sortiment
    label: "🥖 Sortiment"
    files:
      - name: sortiment
        label: "Sortiment und Café-Menü"
        file: content/sortiment.json
        fields:
          - { name: cafe_titel, label: "Café: Überschrift", widget: string }
          - { name: cafe_text, label: "Café: Text darunter", widget: text }
          - name: cafe_menue
            label: "Café-Menü"
            label_singular: "Menüpunkt"
            widget: list
            summary: "{{name}}"
            fields:
              - { name: name, label: "Name", widget: string }
              - { name: beschreibung, label: "Beschreibung", widget: string }
          - { name: cafe_zusatz, label: "Café: Hinweis unter dem Menü (optional)", widget: string, required: false }
          - name: kategorien
            label: "Brot- und Backwaren-Kategorien"
            label_singular: "Kategorie"
            widget: list
            summary: "{{titel}}"
            hint: "Die Reihenfolge lässt sich per Ziehen ändern. Die Kategorien erscheinen abwechselnd hell und dunkel."
            fields:
              - { name: titel, label: "Überschrift", widget: string, hint: "z.B. Dinkelbrote" }
              - { name: kurzname, label: "Kurzname für das Menü oben", widget: string, hint: "z.B. Dinkelbrote" }
              - { name: anker, label: "Sprung-Ziel (nicht ändern)", widget: string, required: false, hint: "Wird für Links von der Startseite gebraucht. Bei neuen Kategorien einfach leer lassen." }
              - { name: text, label: "Kurzer Text unter der Überschrift", widget: string, required: false }
              - { name: bild, label: "Bild", widget: image }
              - { name: bild_alt, label: "Bild beschreiben (für Sehbehinderte und Google)", widget: string, required: false }
              - name: produkte
                label: "Produkte"
                label_singular: "Produkt"
                widget: list
                summary: "{{name}}"
                fields:
                  - { name: name, label: "Name", widget: string, hint: "z.B. Saatenkracher" }
                  - { name: beschreibung, label: "Beschreibung", widget: string }
                  - { name: hinweis, label: "Kleines Etikett (optional)", widget: string, required: false, hint: "z.B. Bestseller, Saisonal, Neu" }
              - { name: zusatz, label: "Hinweis unter den Produkten (optional)", widget: string, required: false }

  # ----------------------------------------------------------
  - name: oeffnungszeiten
    label: "🕒 Öffnungszeiten"
    files:
      - name: oeffnungszeiten
        label: "Öffnungszeiten beider Standorte"
        file: content/oeffnungszeiten.json
        fields:
          - name: baeckerei
            label: "Bäckerei Welzheimer Straße"
            widget: object
            fields:
              - name: oeffnungszeiten
                label: "Öffnungszeiten"
                label_singular: "Zeile"
                widget: list
                required: false
                summary: "{{tage}}: {{zeit}}"
                fields:
                  - { name: tage, label: "Tage", widget: string, hint: "z.B. Montag – Freitag" }
                  - { name: zeit, label: "Uhrzeit", widget: string, hint: "z.B. 6:00 – 13:00 Uhr oder geschlossen" }
              - { name: hinweis, label: "Hinweis (optional)", widget: string, required: false, hint: "z.B. Am 24.12. nur bis 11 Uhr geöffnet" }
          - name: cafe
            label: "Café am Pflegecampus"
            widget: object
            fields:
              - name: oeffnungszeiten
                label: "Öffnungszeiten"
                label_singular: "Zeile"
                widget: list
                required: false
                summary: "{{tage}}: {{zeit}}"
                fields:
                  - { name: tage, label: "Tage", widget: string }
                  - { name: zeit, label: "Uhrzeit", widget: string }
              - { name: hinweis, label: "Hinweis (optional)", widget: string, required: false }
